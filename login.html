<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — SGDM</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-body">

  <nav class="nav">
    <div class="nav-logo">
      <img src="Imagenes/Logo_Pagina.png" alt="Logo_Página" class="nav-logo-img"/>
      <span class="nav-logo-text">PrimeCup</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link-visible">Volver al inicio</a>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-card">

      <div class="auth-header">
        <h1 class="auth-title">Iniciar sesión</h1>
        <p class="auth-subtitle">Ingresá a tu cuenta para gestionar tus torneos</p>
      </div>

      <form class="auth-form" id="loginForm">

        <div class="form-group" id="group-login">
          <label class="form-label" for="login">Usuario o correo electrónico</label>
          <input type="text" id="login" class="form-input form-input-lg" placeholder="Tu usuario o correo" autocomplete="username"/>
          <span class="form-error" id="error-login"></span>
        </div>

        <div class="form-group" id="group-password">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-password-wrap">
            <input type="password" id="password" class="form-input form-input-lg" placeholder="Tu contraseña" autocomplete="current-password"/>
          </div>
          <span class="form-error" id="error-password"></span>
        </div>

        <div class="form-forgot">
          <a href="login.html">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary btn-lg btn-block">Iniciar sesión</button>

        <div class="form-alert form-alert-error" id="alert-login" style="display:none;">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>Usuario o contraseña incorrectos.</span>
        </div>

      </form>

      <div class="auth-footer">
        ¿No tenés cuenta? <a href="register.html">Registrate acá</a>
      </div>

    </div>
  </main>

</body>
</html>
