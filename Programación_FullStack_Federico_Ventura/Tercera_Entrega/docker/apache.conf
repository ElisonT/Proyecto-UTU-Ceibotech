# No mostrar la versión de Apache ni del sistema, y no responder al método TRACE.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # El código y la configuración no se sirven por web.
    <DirectoryMatch "^/var/www/html/(app|config|bd|docker)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Las fotos que suben los usuarios nunca se ejecutan como PHP.
    <Directory /var/www/html/uploads>
        php_admin_flag engine off
    </Directory>

    # Archivos ocultos (.env, .git, .htaccess...).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Cabeceras de seguridad (sin HSTS: en Docker el sitio se sirve por HTTP en el equipo local).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Política de contenido (CSP): solo se ejecutan scripts propios (el código no lleva JavaScript incrustado),
    # los estilos y fuentes pueden venir además de cdnjs (Font Awesome), y nadie puede enmarcar el sitio ni
    # mandar formularios a otro dominio. No se aplica a reglas.php: es el PDF de reglas de un torneo y el visor
    # de PDF de algunos navegadores no abre bajo "object-src 'none'".
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" "expr=%{REQUEST_URI} !~ m#/reglas[.]php$#"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
