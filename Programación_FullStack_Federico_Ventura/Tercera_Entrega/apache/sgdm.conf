# ------------------------------------------------------------
# apache/sgdm.conf: VirtualHosts para la VM con AlmaLinux (httpd + php-fpm).
# Se copia a /etc/httpd/conf.d/sgdm.conf junto con sgdm-comun.inc (ver la guía
# LEEME-VM-ALMALINUX). El equivalente para Docker es docker/apache.conf, que
# sirve HTTP porque solo se usa en el equipo local.
#
# Requiere el paquete mod_ssl y un certificado en las rutas de abajo
# (la guía explica cómo generarlo).
# ------------------------------------------------------------

# No mostrar la versión de Apache ni del sistema en las cabeceras ni en las páginas de error,
# y no responder al método TRACE.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Puerto 80: no sirve el sitio, solo manda al visitante a la versión HTTPS.
<VirtualHost *:80>
    ServerName sgdm.local
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]

    ErrorLog  /var/log/httpd/sgdm_http_error.log
    CustomLog /var/log/httpd/sgdm_http_access.log combined
</VirtualHost>

# Puerto 443: el sitio, cifrado con TLS.
<VirtualHost *:443>
    ServerName sgdm.local
    Include /etc/httpd/conf.d/sgdm-comun.inc

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile    /etc/pki/tls/certs/sgdm.crt
    SSLCertificateKeyFile /etc/pki/tls/private/sgdm.key

    # Cabeceras de seguridad. HSTS con vigencia corta (5 minutos) porque el certificado es
    # autofirmado: subir max-age solo cuando haya un certificado emitido por una autoridad.
    Header always set Strict-Transport-Security "max-age=300"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Política de contenido (CSP): solo se ejecutan scripts propios (el código no lleva JavaScript incrustado),
    # los estilos y fuentes pueden venir además de cdnjs (Font Awesome), y nadie puede enmarcar el sitio ni
    # mandar formularios a otro dominio. No se aplica a reglas.php: es el PDF de reglas de un torneo y el visor
    # de PDF de algunos navegadores no abre bajo "object-src 'none'".
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" "expr=%{REQUEST_URI} !~ m#/reglas[.]php$#"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    ErrorLog  /var/log/httpd/sgdm_error.log
    CustomLog /var/log/httpd/sgdm_access.log combined
</VirtualHost>
