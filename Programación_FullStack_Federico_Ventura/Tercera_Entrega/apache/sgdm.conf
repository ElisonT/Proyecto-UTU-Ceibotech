# ============================================================
# sgdm.conf
# VirtualHost de Apache para el proyecto SGDM / PrimeCup.
#
# En AlmaLinux este archivo va en: /etc/httpd/conf.d/sgdm.conf
# (cualquier archivo .conf ahí adentro se carga solo).
# ============================================================

<VirtualHost *:80>
    # Cambiá esto por la ruta real donde está clonado el proyecto en el servidor
    # (por ejemplo /var/www/sgdm, no /tmp: /tmp se puede borrar en un reinicio).
    DocumentRoot "/var/www/sgdm"
    ServerName sgdm.local

    <Directory "/var/www/sgdm">
        # Permite que Apache siga symlinks y que .htaccess (si se usa) tenga efecto
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Si existe index.php se prioriza sobre index.html (login.php/register.php
        # ya funcionan por nombre de archivo, esto es solo para "/")
        DirectoryIndex index.html index.php
    </Directory>

    ErrorLog  /var/log/httpd/sgdm_error.log
    CustomLog /var/log/httpd/sgdm_access.log combined
</VirtualHost>
