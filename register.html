<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse — SGDM</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-body">

  <nav class="nav">
    <div class="nav-logo">
      <img src="Imagenes/Logo_Pagina.png" alt="Logo_Página" class="nav-logo-img"/>
      <span class="nav-logo-text">PrimeCup</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link-visible">Volver al inicio</a>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-card">

      <div class="auth-header">
        <h1 class="auth-title">Crear cuenta</h1>
        <p class="auth-subtitle">Registrate para empezar a participar en torneos</p>
      </div>

      <form class="auth-form" id="registerForm">

        <!-- FILA 1: USUARIO -->
        <div class="form-group" id="group-usuario">
          <label class="form-label" for="usuario">Nombre de usuario</label>
          <input 
            type="text" 
            id="usuario" 
            class="form-input" 
            placeholder="ej: usuario_user1"
            pattern="[a-zA-Z0-9_]+"
            title="Solo letras, números y guion bajo, sin espacios"
            required
          />
          <span class="form-error" id="error-usuario"></span>
        </div>

        <!-- FILA 2: NOMBRE COMPLETO -->
        <div class="form-group" id="group-nombre">
          <label class="form-label" for="nombre">Nombre completo</label>
          <input 
            type="text" 
            id="nombre" 
            class="form-input" 
            placeholder="Tu nombre y apellido"
            pattern="[A-Za-záéíóúÁÉÍÓÚñÑ]+ [A-Za-záéíóúÁÉÍÓÚñÑ].*"
            title="Ingresá tu nombre y apellido"
            required
          />
          <span class="form-error" id="error-nombre"></span>
        </div>

        <!-- FILA 3: CORREO -->
        <div class="form-group" id="group-email">
          <label class="form-label" for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-input" placeholder="ejemplo@correo.com" autocomplete="email"/>
          <span class="form-error" id="error-email"></span>
        </div>

        <!-- FILA 4: CELULAR -->
        <div class="form-group" id="group-celular">
          <label class="form-label" for="celular">Número de celular</label>
          <input type="tel" id="celular" class="form-input" placeholder="+598 09X XXX XXX" pattern="[0-9+\s]+" autocomplete="tel"/>
          <span class="form-error" id="error-celular"></span>
        </div>

        <!-- FILA 5: CONTRASEÑA -->
        <div class="form-row">
          <div class="form-group" id="group-password">
            <label class="form-label" for="password">Contraseña</label>
            <div class="input-password-wrap">
              <input type="password" id="password" class="form-input" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required/>
            </div>
            <span class="form-hint">Usá al menos 8 caracteres.</span>
            <span class="form-error" id="error-password"></span>
          </div>
          <div class="form-group" id="group-confirm">
            <span class="form-error" id="error-confirm"></span>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-lg btn-block">Crear cuenta</button>

        <div class="form-alert form-alert-success" id="alert-success" style="display:none;">
          <i class="fa-solid fa-circle-check"></i>
          <span>¡Cuenta creada correctamente! Podés iniciar sesión.</span>
        </div>

      </form>

      <div class="auth-footer">
        ¿Ya tenés cuenta? <a href="login.html">Iniciá sesión acá</a>
      </div>

    </div>
  </main>

</body>
</html>
