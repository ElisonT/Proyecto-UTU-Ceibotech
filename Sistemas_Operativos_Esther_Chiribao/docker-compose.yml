version: "3.9"

# =========================================================================
# docker-compose.yml - Orquesta la app web (Apache+PHP) y la base de datos
# MySQL del sistema SGDM / PrimeCup como dos contenedores conectados en
# red interna. La web solo expone el puerto 80; MySQL no sale a internet.
# =========================================================================

services:

  web:
    build: .
    container_name: sgdm_web
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      DB_HOST: db
      DB_NAME: sgdm_primecup
      DB_USER: sgdm_app
      DB_PASS: ${DB_APP_PASSWORD}
    depends_on:
      - db
    networks:
      - sgdm_net

  db:
    image: mysql:8.0
    container_name: sgdm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: sgdm_primecup
      MYSQL_USER: sgdm_app
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - sgdm_db_data:/var/lib/mysql
      - ./DDL_PrimeCup.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
    # No se publica ningun puerto hacia afuera: MySQL solo es accesible
    # desde el contenedor "web" a traves de la red interna "sgdm_net".
    networks:
      - sgdm_net

volumes:
  sgdm_db_data:

networks:
  sgdm_net:
    driver: bridge
